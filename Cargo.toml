[package]
name = "spectrumdeck-pocket-plugin"
version = "0.2.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
extism-pdk = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32fast = "1"
uuid = { version = "1", features = ["v5"] }
unicode-normalization = "0.1"
unicode-casefold = "0.2"
